version: '3.8'

services:
  # Database verification service
  db-verify:
    build:
      context: .
      dockerfile: Dockerfile.db-verify
    depends_on:
      - aerospike
      - ipfs
      - indexeddb-test
    volumes:
      - ./:/app
    environment:
      - AEROSPIKE_HOST=aerospike
      - AEROSPIKE_PORT=3000
      - AEROSPIKE_NAMESPACE=theo
      - IPFS_HOST=ipfs-node
      - IPFS_PORT=5001
      - IPFS_PROTOCOL=http
    networks:
      - default

  # Aerospike
  aerospike:
    image: aerospike/aerospike-server:latest
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    volumes:
      - aerospike-data:/opt/aerospike/data
    environment:
      - NAMESPACE=theo
    healthcheck:
      test: ["CMD", "asinfo", "-v", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default

  # IPFS
  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs-node
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs-data:/data/ipfs
    environment:
      - IPFS_PROFILE=server
      - IPFS_PATH=/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default

  # IndexedDB doesn't need a container as it's browser-based
  # But we can add a simple web server to serve test pages
  indexeddb-test:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./test/indexeddb:/usr/share/nginx/html
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default

networks:
  default:

volumes:
  aerospike-data:
  ipfs-data: