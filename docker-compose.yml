version: '3.8'

services:
  # Development environment
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    command: --cmd help
    environment:
      - GO_ENV=development

  # Run tests
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/app
    environment:
      - GO_ENV=test

  # Build cross-platform binaries
  build:
    build:
      context: .
      dockerfile: Dockerfile.build
    volumes:
      - ./dist:/dist

  # Import a Git repository
  import-git:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    command: --cmd import-git --repo ${REPO_ID:-example} --owner ${OWNER_ID:-owner} --user ${USER_ID:-user} --source ${SOURCE_REPO:-https://github.com/example/repo.git}
    environment:
      - GO_ENV=production

  # Export chains
  export:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    command: --cmd export --repo ${REPO_ID:-example} ${JSONL:---jsonl}
    environment:
      - GO_ENV=production

  # Show repository status
  status:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    command: --cmd status --repo ${REPO_ID:-example}
    environment:
      - GO_ENV=production

  # Add a commit
  commit:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    command: --cmd commit --repo ${REPO_ID:-example} --user ${USER_ID:-user} --message "${MESSAGE:-Commit message}" --branch ${BRANCH:-main}
    environment:
      - GO_ENV=production

  # Add a tag
  tag:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    command: --cmd tag --repo ${REPO_ID:-example} --user ${USER_ID:-user} --tag-name ${TAG_NAME:-v1.0.0} --message "${MESSAGE:-Tag message}"
    environment:
      - GO_ENV=production

  # Record a branch deletion
  branch-delete:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    command: --cmd branch-delete --repo ${REPO_ID:-example} --user ${USER_ID:-user} --branch ${BRANCH:-feature-branch} --message "${MESSAGE:-Branch deletion reason}"
    environment:
      - GO_ENV=production