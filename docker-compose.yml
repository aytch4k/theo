version: '3.8'

services:
  # Development environment
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - theo-data:/data
    command: ["sh", "-c", "go run ./cmd/theo"]
    environment:
      - THEO_DATA_DIR=/data

  # Test environment
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/app
    command: ["go", "test", "-v", "./..."]

  # Build environment for Linux
  build-linux:
    build:
      context: .
      dockerfile: Dockerfile.build
      args:
        TARGETOS: linux
        TARGETARCH: amd64
    volumes:
      - ./dist:/app/dist

  # Build environment for macOS
  build-macos:
    build:
      context: .
      dockerfile: Dockerfile.build
      args:
        TARGETOS: darwin
        TARGETARCH: amd64
    volumes:
      - ./dist:/app/dist

  # Build environment for Windows
  build-windows:
    build:
      context: .
      dockerfile: Dockerfile.build
      args:
        TARGETOS: windows
        TARGETARCH: amd64
    volumes:
      - ./dist:/app/dist

  # Build all platforms
  build-all:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ./dist:/app/dist
    command: ["sh", "-c", "./scripts/build.sh"]

volumes:
  theo-data: