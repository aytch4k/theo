version: '3.8'

services:
  # Development service
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    command: ["serve"]
    ports:
      - "8080:8080"
    environment:
      - THEO_ENV=development
      - THEO_DATA_DIR=/app/data

  # Test service
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/app
    environment:
      - THEO_ENV=test

  # Build service for cross-platform binaries
  build:
    build:
      context: .
      dockerfile: Dockerfile.build
    volumes:
      - ./dist:/dist
    command: ["cp", "-r", "/dist", "/app/"]

  # Release service
  release:
    build:
      context: .
      dockerfile: Dockerfile.build
    volumes:
      - ./dist:/dist
    command: >
      sh -c "mkdir -p /app/dist &&
             cp -r /dist/*.zip /app/dist/ &&
             echo 'Release artifacts created in ./dist directory'"

volumes:
  data: